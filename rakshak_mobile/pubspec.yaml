name: rakshak
description: Rakshak Patrol Security App.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.4
  cupertino_icons: ^1.0.8
  # QR Scanning
  mobile_scanner: ^5.1.1
  # Locked Camera (No gallery intent)
  camera: ^0.11.0
  
  # GPS coordinates
  geolocator: ^11.0.0
  
  # Image manipulation (Compression & Watermarking)
  image: ^4.1.7
  
  # File system paths for saving photos
  path_provider: ^2.1.2
  sqflite: ^2.3.0
  path: ^1.9.0
  connectivity_plus: ^6.0.3
  uuid: ^4.3.3
  image_picker: ^1.0.4
  system_clock: ^3.0.0 #access system clock 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
