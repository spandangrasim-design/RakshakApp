name: Build Rakshak Field APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'rakshak_field/**'
      - '.github/workflows/build-field-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./rakshak_field

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # The android/ folder is a copy of the main Rakshak app's known-good project
      # (same Gradle / Android Gradle Plugin / Kotlin), with its own app id com.rakshak.field.
      - name: Check Android manifest permissions
        run: |
          for perm in CAMERA ACCESS_FINE_LOCATION INTERNET; do
            grep -q "android.permission.$perm" android/app/src/main/AndroidManifest.xml || { echo "Missing permission: $perm"; exit 1; }
          done
          echo "Manifest permissions OK"

      - name: Check this is the Field app (not a copy of the main app)
        run: |
          if grep -rq "com.example.rakshak" android/app/build.gradle.kts android/app/src/main/AndroidManifest.xml 2>/dev/null; then
            echo "android/ still has the MAIN app id (com.example.rakshak). Use the android/ folder from the Field app package."; exit 1
          fi
          grep -q 'android:label="Rakshak Field"' android/app/src/main/AndroidManifest.xml || { echo 'App label must be "Rakshak Field".'; exit 1; }
          echo "Field app identity OK"

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rakshak-field-release-apk
          path: rakshak_field/build/app/outputs/flutter-apk/*.apk
