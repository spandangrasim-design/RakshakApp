name: Rakshak PR Linting

on:
  pull_request:
    branches: [ "main" ]

jobs:
  web-lint:
    name: React Admin Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./rakshak-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run lint

  mobile-analyze:
    name: Flutter Guard App Analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./rakshak_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter analyze
