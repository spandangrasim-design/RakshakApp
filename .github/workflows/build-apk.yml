name: Build Rakshak Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./rakshak_mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Native Scaffolding
        run: |
          if [ ! -d "android" ]; then
            echo "Generating missing android native folder..."
            flutter create . --platforms=android --org com.rakshak.patrol --project-name rakshak_mobile
          fi

      - name: Inject Android Permissions & Features
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          
          # Use python to cleanly insert permissions right under <manifest ...>
          python3 -c '
          import re

          permissions = """
              <!-- Network permissions for Cloudflare Worker & Supabase API -->
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <!-- Camera permissions for QR scanner & incident photos -->
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />

              <!-- GPS Location permissions for Geofence validation -->
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-feature android:name="android.hardware.location.gps" android:required="false" />
          """

          with open("android/app/src/main/AndroidManifest.xml", "r") as f:
              content = f.read()

          # Insert permissions right after <manifest ...>
          new_content = re.sub(r"(<manifest[^>]*>)", r"\1\n" + permissions, content, count=1)

          with open("android/app/src/main/AndroidManifest.xml", "w") as f:
              f.write(new_content)
          '

          # Ensure minimum SDK is 21 for camera & location hardware
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/flutter.minSdkVersion/21/g' android/app/build.gradle
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/flutter.minSdkVersion/21/g' android/app/build.gradle.kts
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Production Release APK
        run: flutter build apk --release

      - name: Upload Production APK
        uses: actions/upload-artifact@v4
        with:
          name: rakshak-patrol-release-apk
          path: rakshak_mobile/build/app/outputs/flutter-apk/app-release.apk