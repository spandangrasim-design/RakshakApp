name: rakshak_field
description: Rakshak Field - a no-login patrol app for guards.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.4
  mobile_scanner: ^5.1.1
  camera: ^0.11.0
  geolocator: ^11.0.0
  image_picker: ^1.0.4
  uuid: ^4.3.3

flutter:
  uses-material-design: true
