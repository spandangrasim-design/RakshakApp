name = "rakshak-api"
main = "src/index.ts"
compatibility_date = "2026-04-01"

# Production Custom Domain Routing
workers_dev = true

[vars]
ENVIRONMENT = "production"
SUPABASE_URL = "https://subydhacosoarzfsusxz.supabase.co"

# Bind Cloudflare R2 bucket for photo proofs
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "rakshak-images"

# SLA Escalation Cron Trigger (Every 10 minutes)
[triggers]
crons = ["*/10 * * * *"]
